name: Atualizar feed de commits

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC = 06:00 Fortaleza, todo dia
  workflow_dispatch: # botão manual também

# O bot publica com GITHUB_TOKEN, e push feito com GITHUB_TOKEN NAO dispara
# workflow (regra anti-recursao do GitHub). Por isso o deploy do Pages vive
# aqui dentro: sem este job, o feed atualizava no repo e o site ficava velho.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Buscar commits recentes e regenerar src/data/commits.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import subprocess, json

          repos = ["ranzouu.github.io", "EFI-T480-ThinkPad", "dashboard-vendas-financeiro",
                   "pokemon-team-analyzer", "pokevgc-cli", "OmniAstra"]
          feed = []
          for repo in repos:
              try:
                  r = subprocess.run(
                      ["gh", "api", f"repos/ranzouu/{repo}/commits?per_page=3",
                       "--jq", '.[] | {sha: .sha[0:7], msg: (.commit.message | split("\n")[0]), date: .commit.author.date}'],
                      capture_output=True, text=True, timeout=30)
                  for line in r.stdout.strip().split("}\n{"):
                      if not line.strip():
                          continue
                      try:
                          line = '{' + line if not line.startswith('{') else line
                          line = line + '}' if not line.endswith('}') else line
                          c = json.loads(line)
                          feed.append({"repo": repo, "sha": c["sha"], "msg": c["msg"], "date": c["date"]})
                      except Exception:
                          pass
              except Exception:
                  pass

          feed.sort(key=lambda c: c["date"], reverse=True)
          feed = feed[:8]

          ts = "// Gerado automaticamente pelo GitHub Action (daily). NAO editar a mao.\n"
          ts += "export interface Commit {\n  repo: string;\n  sha: string;\n  msg: string;\n  date: string;\n}\n\n"
          ts += "export const recentCommits: Commit[] = [\n"
          for c in feed:
              msg = c["msg"].replace("\\", "\\\\").replace('"', '\\"')
              ts += f'  {{ repo: "{c["repo"]}", sha: "{c["sha"]}", msg: "{msg}", date: "{c["date"]}" }},\n'
          ts += "];\n"

          with open("src/data/commits.ts", "w") as f:
              f.write(ts)
          print(f"{len(feed)} commits escritos")
          EOF

      - name: Commit se mudou
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet src/data/commits.ts; then
            echo "sem mudanças"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add src/data/commits.ts
            git commit -m "chore: atualiza feed de commits [bot]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Só roda quando o feed realmente mudou: build + publish do Pages.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4